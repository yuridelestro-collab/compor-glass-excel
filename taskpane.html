<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compor Glass – Limpar Cores</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; color: #222; }
    h2 { font-size: 19px; margin: 0 0 10px; }
    p { line-height: 1.45; font-size: 14px; }
    button { background: #217346; color: white; border: 0; border-radius: 4px;
      padding: 11px 16px; font-size: 14px; cursor: pointer; width: 100%; }
    button:disabled { opacity: .6; cursor: wait; }
    #status { margin-top: 14px; font-size: 13px; min-height: 36px; }
    .note { color: #666; font-size: 12px; }
  </style>
</head>
<body>
  <h2>Compor Glass – Limpar Cores</h2>
  <p>Selecione as células na planilha e clique no botão abaixo.</p>
  <button id="clearButton" disabled>Limpar cores da seleção</button>
  <div id="status" role="status">Carregando suplemento…</div>
  <p class="note">Remove somente o preenchimento e define a fonte como preta. Bordas e demais formatações são preservadas.</p>
  <script>
    Office.onReady((info) => {
      const button = document.getElementById("clearButton");
      const status = document.getElementById("status");
      if (info.host !== Office.HostType.Excel) {
        status.textContent = "Abra este suplemento no Excel.";
        return;
      }
      button.disabled = false;
      status.textContent = "Pronto. Selecione as células na planilha.";
      button.addEventListener("click", async () => {
        button.disabled = true;
        status.textContent = "Aplicando formatação…";
        try {
          await Excel.run(async (context) => {
            const selectedRange = context.workbook.getSelectedRange();
            selectedRange.format.fill.clear();
            selectedRange.format.font.color = "#000000";
            await context.sync();
          });
          status.textContent = "Concluído: preenchimento removido e fonte preta.";
        } catch (error) {
          status.textContent = "Não foi possível aplicar: " + (error.message || error);
        } finally {
          button.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
